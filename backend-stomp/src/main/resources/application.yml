server:
  port: 8081

blueprints:
  # Orígenes permitidos para el handshake WebSocket (separados por coma).
  allowed-origins: ${BLUEPRINTS_ALLOWED_ORIGINS:http://localhost:5173}

logging:
  level:
    com.eci.blueprints.rt: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
